<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="740" viewBox="0 0 1120 740"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#00847e"/></marker></defs><rect width="100%" height="100%" fill="#f5f9fb"/><g font-family="Arial,sans-serif" fill="#0b2d50"><text x="30" y="44" font-size="27" font-weight="700">Game On! | Architecture and execution boundaries</text><text x="30" y="86" font-size="14" font-weight="700">HOSTED PRODUCT</text><rect x="30" y="110" width="320" height="105" rx="12" fill="#eef7f5" stroke="#00847e"/><text x="46" y="137" font-size="17" font-weight="700">Browser</text><text x="46" y="161" font-size="14">Real sign-in, groups, votes</text><text x="46" y="181" font-size="14">MapLibre + vanilla JavaScript</text><path d="M190,215 L190,240" stroke="#00847e" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="30" y="245" width="320" height="105" rx="12" fill="#eef7f5" stroke="#00847e"/><text x="46" y="272" font-size="17" font-weight="700">FastAPI + Neon</text><text x="46" y="296" font-size="14">Managed Better Auth / JWT checks</text><text x="46" y="316" font-size="14">PostgreSQL groups and profiles</text><path d="M190,350 L190,375" stroke="#00847e" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="30" y="380" width="320" height="105" rx="12" fill="#eef7f5" stroke="#00847e"/><text x="46" y="407" font-size="17" font-weight="700">Bounded LangGraph</text><text x="46" y="431" font-size="14">Deterministic decide / tool / observe</text><text x="46" y="451" font-size="14">Curated ranking + cached prices</text><path d="M190,485 L190,510" stroke="#00847e" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="30" y="515" width="320" height="105" rx="12" fill="#eef7f5" stroke="#00847e"/><text x="46" y="542" font-size="17" font-weight="700">Organiser handoff</text><text x="46" y="566" font-size="14">Revalidate revision and permission</text><text x="46" y="586" font-size="14">Official site / brief / calendar</text><text x="400" y="86" font-size="14" font-weight="700">ISOLATED AGENT BRAIN DEMO</text><rect x="400" y="110" width="320" height="105" rx="12" fill="#eef7f5" stroke="#00847e"/><text x="416" y="137" font-size="17" font-weight="700">No-login Demo Studio</text><text x="416" y="161" font-size="14">Fictional group and approved times</text><text x="416" y="181" font-size="14">A: success / B: replan / C: help</text><path d="M560,215 L560,240" stroke="#00847e" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="400" y="245" width="320" height="105" rx="12" fill="#eef7f5" stroke="#00847e"/><text x="416" y="272" font-size="17" font-weight="700">Actual bounded LangGraph</text><text x="416" y="296" font-size="14">Provider observations are simulated</text><text x="416" y="316" font-size="14">No Neon, accounts or live provider</text><path d="M560,350 L560,375" stroke="#00847e" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="400" y="380" width="320" height="105" rx="12" fill="#eef7f5" stroke="#00847e"/><text x="416" y="407" font-size="17" font-weight="700">Recorded execution replay</text><text x="416" y="431" font-size="14">One event per real graph trace entry</text><text x="416" y="451" font-size="14">Replay makes no new tool requests</text><path d="M560,485 L560,510" stroke="#00847e" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="400" y="515" width="320" height="105" rx="12" fill="#eef7f5" stroke="#00847e"/><text x="416" y="542" font-size="17" font-weight="700">Fictional approval</text><text x="416" y="566" font-size="14">Server revalidates scenario outcome</text><text x="416" y="586" font-size="14">Always not booked</text><text x="770" y="86" font-size="14" font-weight="700">LOCAL PLAYWRIGHT EVIDENCE</text><rect x="770" y="110" width="320" height="105" rx="12" fill="#eef7f5" stroke="#00847e"/><text x="786" y="137" font-size="17" font-weight="700">Fresh visible Chromium</text><text x="786" y="161" font-size="14">Official Playbypoint booking page</text><text x="786" y="181" font-size="14">Approved future time and category</text><path d="M930,215 L930,240" stroke="#00847e" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="770" y="245" width="320" height="105" rx="12" fill="#eef7f5" stroke="#00847e"/><text x="786" y="272" font-size="17" font-weight="700">Read-only selection tool</text><text x="786" y="296" font-size="14">Exact interval and offered courts</text><text x="786" y="316" font-size="14">Timestamp + source + unknowns</text><path d="M930,350 L930,375" stroke="#00847e" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="770" y="380" width="320" height="105" rx="12" fill="#eef7f5" stroke="#00847e"/><text x="786" y="407" font-size="17" font-weight="700">Existing LangGraph</text><text x="786" y="431" font-size="14">Consumes real typed observations</text><text x="786" y="451" font-size="14">No LLM calls in verified run</text><path d="M930,485 L930,510" stroke="#00847e" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="770" y="515" width="320" height="105" rx="12" fill="#eef7f5" stroke="#00847e"/><text x="786" y="542" font-size="17" font-weight="700">Supervised price summary</text><text x="786" y="566" font-size="14">Next requires specific approval</text><text x="786" y="586" font-size="14">Historical quote, not a booking</text><text x="30" y="690" font-size="15">Separate boundaries: local Playwright is not deployed to Vercel. No automatic booking or payment.</text></g></svg>