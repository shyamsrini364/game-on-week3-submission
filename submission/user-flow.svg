<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="740" viewBox="0 0 1120 740"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#00847e"/></marker></defs><rect width="100%" height="100%" fill="#f5f9fb"/><g font-family="Arial,sans-serif" fill="#0b2d50"><text x="30" y="44" font-size="27" font-weight="700">Game On! | Group-to-handoff user flow</text><rect x="30" y="110" width="320" height="130" rx="12" fill="#eef7f5" stroke="#00847e"/><text x="46" y="137" font-size="17" font-weight="700">1  Join your group</text><text x="46" y="161" font-size="14">Hosted: magic-link authentication</text><text x="46" y="181" font-size="14">Invitation and group access checked</text><path d="M350,175 L395,175" stroke="#00847e" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="400" y="110" width="320" height="130" rx="12" fill="#eef7f5" stroke="#00847e"/><text x="416" y="137" font-size="17" font-weight="700">2  Agree on a time</text><text x="416" y="161" font-size="14">Singles or Doubles; submit votes</text><text x="416" y="181" font-size="14">Only qualifying group-approved slots</text><path d="M720,175 L765,175" stroke="#00847e" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="770" y="110" width="320" height="130" rx="12" fill="#eef7f5" stroke="#00847e"/><text x="786" y="137" font-size="17" font-weight="700">3  Ask Ernie</text><text x="786" y="161" font-size="14">Read snapshot and evaluate tools</text><text x="786" y="181" font-size="14">Preserve vote and revision boundaries</text><rect x="30" y="330" width="320" height="130" rx="12" fill="#eef7f5" stroke="#00847e"/><text x="46" y="357" font-size="17" font-weight="700">4  Review a proposal</text><text x="46" y="381" font-size="14">Venue, court, time and price status</text><text x="46" y="401" font-size="14">Unknown availability stays unknown</text><path d="M350,395 L395,395" stroke="#00847e" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="400" y="330" width="320" height="130" rx="12" fill="#eef7f5" stroke="#00847e"/><text x="416" y="357" font-size="17" font-weight="700">5  Organiser approval</text><text x="416" y="381" font-size="14">Server revalidates the current plan</text><text x="416" y="401" font-size="14">Approval is not a reservation</text><path d="M720,395 L765,395" stroke="#00847e" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="770" y="330" width="320" height="130" rx="12" fill="#eef7f5" stroke="#00847e"/><text x="786" y="357" font-size="17" font-weight="700">6  Booking handoff</text><text x="786" y="381" font-size="14">Open official site / copy brief / .ics</text><text x="786" y="401" font-size="14">User rechecks and books externally</text><path d="M930,240 L930,285" stroke="#00847e" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M930,285 L190,285" stroke="#00847e" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M190,285 L190,330" stroke="#00847e" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="30" y="535" width="1060" height="125" rx="12" fill="#f0f8d7" stroke="#00847e"/><text x="46" y="562" font-size="17" font-weight="700">If a provider observation reports no suitable option</text><text x="46" y="586" font-size="14">The graph may try another already-approved time within its tool budget; otherwise it requests human help.</text><text x="46" y="606" font-size="14">Hosted product uses directory evidence. B/C provider failures are simulated in Agent Brain.</text><text x="46" y="626" font-size="14">Local live access is separately supervised; no silent time changes, holds, reservation confirmation or payment.</text></g></svg>